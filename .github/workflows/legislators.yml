name: Update state legislators
on:
  workflow_dispatch:
  push:
    paths: ["tools/build_legislators.py"]
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_legislators.py
      - name: Commit if changed
        run: |
          git config user.name "public-servants-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publicservants/data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update state legislators from Open States" && git push; fi
