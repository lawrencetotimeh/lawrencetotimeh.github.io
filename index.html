<!DOCTYPE html>

<head>

<meta property="og:title" content="Lawrence Totimeh Jr. — Coming Soon">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --ink:#141414;
    --paper:#ffffff;
    --red:#c1272d;
    --smoke:#f4f4f3;
    --mute:#6e6e6e;
    --line:#e3e3e1;
    --display:'Archivo',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--display);display:flex;align-items:center;justify-content:center;
    padding:32px;
  }
  .card{max-width:560px;text-align:center}
  .eyebrow{
    font-family:var(--mono);font-size:11.5px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;color:var(--red);
    margin:0 0 22px;
  }
  h1{
    font-size:clamp(38px,7vw,58px);font-weight:800;letter-spacing:-.01em;
    line-height:1.05;margin:0 0 22px;
  }
  h1 .jr{color:var(--red)}
  p{color:var(--mute);font-size:17px;line-height:1.6;margin:0 0 30px}
  .line{width:56px;height:2px;background:var(--red);margin:0 auto 30px}
  .contact{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:4px;
  }
  .contact:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">DMV · Apparel · Events · Business Systems</p>
    <h1>Lawrence<br>Totimeh <span class="jr">Jr.</span></h1>
    <div class="line"></div>
    <p>The site is being rebuilt. Apparel and custom print, event hosting, and business systems consulting, all in one place, coming soon.</p>
    <a class="contact" href="mailto:lawrence.totimeh@gmail.com">lawrence.totimeh@gmail.com</a>
  </div>
</body>
</html>
